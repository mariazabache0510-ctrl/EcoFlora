services:
  - type: web
    name: ecoflora-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./docker/frontend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://ecoflora-frontend.onrender.com

  - type: web
    name: ecoflora-backend
    runtime: docker
    plan: free
    dockerfilePath: ./docker/backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://ecoflora-backend.onrender.com
      - key: DB_HOST
        fromDatabase:
          name: ecoflora-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ecoflora-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ecoflora-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ecoflora-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ecoflora-db
          property: password

  - type: psql
    name: ecoflora-db
    plan: free
    version: "15"
